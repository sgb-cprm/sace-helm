{{- $basin := .Values.config.default.name -}}
{{- with .Values.config.selectedBasins -}}
{{- $basin = first . -}}
{{- else -}}
{{- with .Values.config.basins -}}
{{- $basin = (first .).name -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sace.fullname" . }}-test-connection"
  labels:
    {{- include "sace.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "sace.fullname" . }}-{{ $basin }}:{{ .Values.service.port }}/{{ $basin }}/']
  restartPolicy: Never
