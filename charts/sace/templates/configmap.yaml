{{- $saceName := (include "sace.fullname" .) -}}
{{- $saceLabels := (include "sace.labels" .) -}}

{{/* Basins */}}
{{- $saceDefault := .Values.config.default -}}
{{- $saceBasins := .Values.config.basins -}}
{{- $saceNumBasins := len $saceBasins -}}

{{/* set default, if basin is empty */}}
{{- if eq $saceNumBasins 0 -}}
{{- $saceBasins = list $saceDefault -}}
{{- $saceNumBasins = 1 -}}
{{- end -}}

{{- range $index, $item := $saceBasins }}
{{- if $index }}
---
{{ end }}
{{- $_saceProps := mergeOverwrite (deepCopy $saceDefault) $item -}}
{{- $saceContext := printf "/%s" $_saceProps.name -}}
{{- $geojsonDir := $_saceProps.geojsonDir | default (printf "%s/geojson" $_saceProps.persistence) -}}
{{- $wmsConfigJson := $_saceProps.wmsConfigJson | default (printf "/opt/sace/config/wms/wms-layers-config-%s.json" $_saceProps.name) -}}
{{- $kafkaPrevisoes := $_saceProps.kafkaPrevisoes | default dict -}}
{{- $forecastManager := $_saceProps.forecastManager | default dict -}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ (printf "%s-%s" $saceName $_saceProps.name) | lower | replace " " "-" | replace "_" "-" | trunc 63 | trimSuffix "-" }}
  labels:
    {{- $saceLabels | nindent 4 }}
    sace.sgb.gov.br/bacia: {{ $_saceProps.name }}
data:
  # Context path por bacia (Spring Boot: server.servlet.context-path).
  # Mantém o comportamento da versão Jetty, em que cada WAR subia em /<bacia>.
  SERVER_SERVLET_CONTEXT_PATH: {{ $saceContext | quote }}
  JAVA_XMX: {{ $_saceProps.jvm.xmx | quote }}
  JAVA_XMS: {{ $_saceProps.jvm.xms | quote }}
  USER_TIMEZONE: {{ ($_saceProps.timezone | default "America/Sao_Paulo") | quote }}
  ativarAgendamentos: {{ $_saceProps.enableScheduling | quote }}
  ativarRecuperacoes: {{ $_saceProps.enableRetrieve | quote }}
  nomeSistema: {{ $_saceProps.title | quote }}
  imageDir: {{ printf "%s/images" $_saceProps.persistence | quote }}
  ftpDir: {{ printf "%s/ftp" $_saceProps.persistence | quote }}
  urlDir: {{ printf "%s/url" $_saceProps.persistence | quote }}
  geojsonDir: {{ $geojsonDir | quote }}
  JAVA_OPTS: {{ $_saceProps.javaOpts | quote }}
  kafkaBootstrapServers: {{ $_saceProps.kafkaBootstrapServers | quote }}
  kafkaTopico: {{ $_saceProps.kafkaTopico | quote }}
  kafkaTopicoPrevisoeses: {{ ($kafkaPrevisoes.topico | default "previsoes") | quote }}
  kafkaPrevisoesHabilitado: {{ ($kafkaPrevisoes.habilitado | default false) | quote }}
  fmUrl: {{ ($forecastManager.url | default "http://localhost:8000") | quote }}
  fmClientId: {{ ($forecastManager.clientId | default "") | quote }}
  fmClientSecret: {{ ($forecastManager.clientSecret | default "") | quote }}
  fmTimeoutMs: {{ ($forecastManager.timeoutMs | default 3000) | quote }}
  fmHabilitado: {{ ($forecastManager.habilitado | default false) | quote }}
  mailHost: {{ $_saceProps.mailHost | quote }}
  wmsConfigJson: {{ $wmsConfigJson | quote }}
  {{- $url := printf "%s/%s" (include "sace.urlTemplate" $) $_saceProps.name }}
  urlSistema: {{ $_saceProps.url | default $url | quote }}
immutable: false
{{- end }}
